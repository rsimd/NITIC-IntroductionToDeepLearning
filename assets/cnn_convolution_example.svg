<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">畳み込み層の計算例</title>
  <desc id="desc">4 x 4 の画像に 3 x 3 のフィルタを重ねて，対応する値をかけて足し合わせ，2 x 2 の特徴マップを作る。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .label { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .celltext { font-size: 27px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .note { font-size: 17px; fill: #475569; }
      .caption { font-size: 20px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1180" height="560" fill="#ffffff"/>
  <text x="590" y="48" class="label title" text-anchor="middle">畳み込み層: フィルタで小さな特徴を取り出す</text>
  <text x="590" y="82" class="label subtitle" text-anchor="middle">フィルタを画像の上で動かし，重なった数を「かけて足す」。出てきた表が特徴マップである。</text>

  <g transform="translate(90 140)">
    <text x="140" y="-22" class="label caption">画像の一部</text>
    <g>
      <rect x="0" y="0" width="280" height="280" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <g stroke="#93c5fd" stroke-width="2">
        <path d="M 70 0 V 280 M 140 0 V 280 M 210 0 V 280 M 0 70 H 280 M 0 140 H 280 M 0 210 H 280"/>
      </g>
      <g class="label celltext">
        <text x="35" y="35">1</text><text x="105" y="35">2</text><text x="175" y="35">3</text><text x="245" y="35">0</text>
        <text x="35" y="105">0</text><text x="105" y="105">1</text><text x="175" y="105">2</text><text x="245" y="105">3</text>
        <text x="35" y="175">3</text><text x="105" y="175">0</text><text x="175" y="175">1</text><text x="245" y="175">2</text>
        <text x="35" y="245">2</text><text x="105" y="245">3</text><text x="175" y="245">0</text><text x="245" y="245">1</text>
      </g>
      <rect x="0" y="0" width="210" height="210" fill="#fde68a" stroke="#d97706" stroke-width="5" opacity="0.45"/>
    </g>
  </g>

  <text x="420" y="295" class="label" font-size="42" font-weight="700" text-anchor="middle">*</text>

  <g transform="translate(470 175)">
    <text x="105" y="-22" class="label caption">フィルタ</text>
    <rect x="0" y="0" width="210" height="210" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <g stroke="#fdba74" stroke-width="2">
      <path d="M 70 0 V 210 M 140 0 V 210 M 0 70 H 210 M 0 140 H 210"/>
    </g>
    <g class="label celltext">
      <text x="35" y="35">2</text><text x="105" y="35">0</text><text x="175" y="35">1</text>
      <text x="35" y="105">0</text><text x="105" y="105">1</text><text x="175" y="105">2</text>
      <text x="35" y="175">1</text><text x="105" y="175">0</text><text x="175" y="175">2</text>
    </g>
  </g>

  <line x1="735" y1="280" x2="805" y2="280" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(840 175)">
    <text x="105" y="-22" class="label caption">特徴マップ</text>
    <rect x="0" y="0" width="210" height="210" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
    <g stroke="#86efac" stroke-width="2">
      <path d="M 105 0 V 210 M 0 105 H 210"/>
    </g>
    <g class="label celltext">
      <text x="52.5" y="52.5">15</text><text x="157.5" y="52.5">16</text>
      <text x="52.5" y="157.5">6</text><text x="157.5" y="157.5">15</text>
    </g>
    <rect x="0" y="0" width="105" height="105" fill="#bbf7d0" stroke="#15803d" stroke-width="4" opacity="0.5"/>
  </g>

  <g transform="translate(105 455)">
    <rect x="0" y="-40" width="970" height="78" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="24" y="-9" class="label note">左上の 15 は，1 x 2 + 2 x 0 + 3 x 1 + 0 x 0 + 1 x 1 + 2 x 2 + 3 x 1 + 0 x 0 + 1 x 2 で計算される。</text>
    <text x="24" y="23" class="label note">実際の CNN では，このフィルタの値そのものをデータから学習する。</text>
  </g>
</svg>
