<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="880" viewBox="0 0 1700 880" role="img" aria-labelledby="title desc">
  <title id="title">畳み込みニューラルネットワーク</title>
  <desc id="desc">数字の「5」の画像が，畳み込み層，プーリング層，全結合層を通って出力へ変換される流れを示す図。</desc>
  <defs>
    <style>
      .label { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif; fill: #172033; }
      .small { font-size: 20px; }
      .medium { font-size: 26px; }
      .large { font-size: 58px; font-weight: 400; }
      .section-title { font-size: 24px; font-weight: 700; }
      .note { font-size: 22px; fill: #3f4a5e; }
      .thin-line { stroke: #386fbd; stroke-width: 3; fill: none; opacity: 0.9; }
      .fan-line { stroke: #386fbd; stroke-width: 3; fill: none; opacity: 0.75; }
      .frame-green { fill: none; stroke: #0aa45c; stroke-width: 8; }
      .frame-red { fill: none; stroke: #f01d1d; stroke-width: 8; }
      .frame-blue { fill: none; stroke: #0aa8d8; stroke-width: 8; }
      .map-stroke { stroke: #20324d; stroke-width: 1.5; }
      .map-shadow { filter: url(#softShadow); }
    </style>

    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#386fbd"/>
    </marker>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#6b7280" flood-opacity="0.22"/>
    </filter>

    <pattern id="pixelGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 H 0 V 10" stroke="#cbd5e1" stroke-width="0.8" fill="none"/>
    </pattern>
    <pattern id="darkSpeckles" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f8fafc"/>
      <circle cx="2" cy="2" r="1.1" fill="#293241"/>
      <circle cx="9" cy="3" r="1.4" fill="#293241"/>
      <circle cx="5" cy="7" r="1.1" fill="#293241"/>
      <circle cx="11" cy="10" r="1.1" fill="#293241"/>
      <circle cx="1" cy="9" r="0.9" fill="#64748b"/>
    </pattern>
    <pattern id="edgePattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f8fafc"/>
      <path d="M 1 13 L 7 2 M 9 15 L 15 5" stroke="#1f2937" stroke-width="1.4"/>
      <circle cx="4" cy="5" r="1.1" fill="#475569"/>
      <circle cx="12" cy="12" r="1.1" fill="#475569"/>
    </pattern>
    <pattern id="poolPattern" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#ffffff"/>
      <rect x="1" y="1" width="6" height="6" fill="#2f3a4a"/>
      <rect x="10" y="3" width="4" height="4" fill="#2f3a4a"/>
      <rect x="5" y="11" width="7" height="5" fill="#64748b"/>
      <circle cx="15" cy="14" r="1.5" fill="#2f3a4a"/>
    </pattern>
    <pattern id="finePattern" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f8fafc"/>
      <path d="M 2 2 H 6 M 8 5 H 13 M 1 10 H 7 M 9 12 H 12" stroke="#263244" stroke-width="1.5"/>
      <circle cx="3" cy="6" r="1" fill="#64748b"/>
      <circle cx="11" cy="2" r="1" fill="#64748b"/>
    </pattern>

    <linearGradient id="activationGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#fff7bf"/>
      <stop offset="1" stop-color="#ffe48a"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ffc515"/>
      <stop offset="1" stop-color="#ffae00"/>
    </linearGradient>

    <clipPath id="inputClip">
      <rect x="34" y="345" width="150" height="150"/>
    </clipPath>
  </defs>

  <rect width="1700" height="880" fill="#ffffff"/>

  <text x="850" y="78" class="label large" text-anchor="middle">畳み込みニューラルネットワーク</text>

  <g class="label note">
    <text x="45" y="185">1個の画像に</text>
    <text x="45" y="219">行われる処理</text>
  </g>

  <g id="input-image" class="map-shadow">
    <rect x="34" y="345" width="150" height="150" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <rect x="34" y="345" width="150" height="150" fill="url(#pixelGrid)"/>
    <g clip-path="url(#inputClip)">
      <text x="109" y="459" text-anchor="middle" class="label" font-family="Arial, sans-serif" font-size="138" font-weight="700" fill="#111827">5</text>
      <path d="M 76 383 H 138 M 77 383 L 70 423 H 123 C 148 423 154 470 108 477 C 88 480 73 473 64 462" stroke="#111827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.16"/>
    </g>
  </g>
  <text x="109" y="545" class="label medium" text-anchor="middle">画像データ</text>

  <path d="M 184 420 C 214 330 222 255 255 236" class="fan-line" marker-end="url(#arrow)"/>
  <path d="M 184 420 C 218 405 225 411 255 420" class="fan-line" marker-end="url(#arrow)"/>
  <path d="M 184 420 C 214 522 222 642 255 660" class="fan-line" marker-end="url(#arrow)"/>

  <g id="conv1">
    <rect x="250" y="120" width="220" height="665" rx="30" class="frame-green"/>
    <text x="360" y="158" class="label section-title" text-anchor="middle">畳み込み層</text>

    <g transform="translate(282 205)" class="map-shadow">
      <rect x="-14" y="-14" width="120" height="120" fill="url(#darkSpeckles)" class="map-stroke"/>
      <rect x="-2" y="-2" width="120" height="120" fill="#fff59d" opacity="0.78" class="map-stroke"/>
      <path d="M 30 20 H 96 M 30 20 L 24 54 H 76 C 104 54 104 96 67 98 C 48 99 34 92 26 82" stroke="#7c6500" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
    </g>
    <g transform="translate(282 390)" class="map-shadow">
      <rect x="-14" y="-14" width="120" height="120" fill="url(#darkSpeckles)" class="map-stroke"/>
      <rect x="-2" y="-2" width="120" height="120" fill="#87d8ef" opacity="0.78" class="map-stroke"/>
      <path d="M 35 22 H 94 M 34 22 L 28 56 H 76 C 104 56 105 91 68 98 C 48 101 32 92 25 82" stroke="#0f5f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
    </g>
    <text x="360" y="546" class="label medium" text-anchor="middle">︙</text>
    <g transform="translate(282 625)" class="map-shadow">
      <rect x="-14" y="-14" width="120" height="120" fill="url(#darkSpeckles)" class="map-stroke"/>
      <rect x="-2" y="-2" width="120" height="120" fill="#fb7185" opacity="0.72" class="map-stroke"/>
      <path d="M 28 24 H 92 M 29 24 L 24 58 H 72 C 100 58 102 91 70 98 C 48 103 33 96 24 86" stroke="#8f1930" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
    </g>
    <text x="360" y="835" class="label medium" text-anchor="middle">特徴を際立たせる</text>
  </g>

  <g id="pool1">
    <rect x="508" y="120" width="170" height="665" rx="22" class="frame-red"/>
    <text x="593" y="158" class="label section-title" text-anchor="middle">プーリング層</text>
    <rect x="548" y="198" width="70" height="70" fill="url(#poolPattern)" class="map-stroke"/>
    <rect x="548" y="388" width="70" height="70" fill="url(#poolPattern)" class="map-stroke"/>
    <text x="583" y="542" class="label medium" text-anchor="middle">︙</text>
    <rect x="548" y="637" width="70" height="70" fill="url(#poolPattern)" class="map-stroke"/>
    <text x="593" y="835" class="label medium" text-anchor="middle">おおざっぱに見る</text>
  </g>

  <g id="conv2">
    <rect x="715" y="120" width="180" height="665" rx="28" class="frame-green"/>
    <text x="805" y="158" class="label section-title" text-anchor="middle">畳み込み層</text>
    <g transform="translate(758 198)" class="map-shadow">
      <rect x="-11" y="-11" width="92" height="92" fill="url(#edgePattern)" class="map-stroke"/>
      <rect x="7" y="7" width="92" height="92" fill="#86efac" opacity="0.58" class="map-stroke"/>
      <rect x="22" y="22" width="58" height="58" fill="#bbf7d0" opacity="0.75" class="map-stroke"/>
    </g>
    <g transform="translate(758 388)" class="map-shadow">
      <rect x="-11" y="-11" width="92" height="92" fill="url(#edgePattern)" class="map-stroke"/>
      <rect x="7" y="7" width="92" height="92" fill="#c4b5fd" opacity="0.58" class="map-stroke"/>
      <rect x="22" y="22" width="58" height="58" fill="#ddd6fe" opacity="0.75" class="map-stroke"/>
    </g>
    <text x="805" y="542" class="label medium" text-anchor="middle">︙</text>
    <g transform="translate(758 640)" class="map-shadow">
      <rect x="-11" y="-11" width="92" height="92" fill="url(#edgePattern)" class="map-stroke"/>
      <rect x="7" y="7" width="92" height="92" fill="#fde68a" opacity="0.58" class="map-stroke"/>
      <rect x="22" y="22" width="58" height="58" fill="#fef3c7" opacity="0.75" class="map-stroke"/>
    </g>
  </g>

  <g id="pool2">
    <rect x="930" y="120" width="160" height="665" rx="22" class="frame-red"/>
    <text x="1010" y="158" class="label section-title" text-anchor="middle">プーリング層</text>
    <rect x="970" y="205" width="55" height="55" fill="url(#finePattern)" class="map-stroke"/>
    <rect x="970" y="395" width="55" height="55" fill="url(#finePattern)" class="map-stroke"/>
    <text x="998" y="542" class="label medium" text-anchor="middle">︙</text>
    <rect x="970" y="652" width="55" height="55" fill="url(#finePattern)" class="map-stroke"/>
  </g>

  <g id="fc1">
    <rect x="1135" y="120" width="135" height="665" rx="22" class="frame-blue"/>
    <text x="1202" y="158" class="label section-title" text-anchor="middle">全結合層</text>
    <circle cx="1202" cy="210" r="38" fill="#07ad59" stroke="#136f42" stroke-width="2"/>
    <circle cx="1202" cy="335" r="38" fill="#07ad59" stroke="#136f42" stroke-width="2"/>
    <text x="1202" y="525" class="label medium" text-anchor="middle">︙</text>
    <circle cx="1202" cy="685" r="38" fill="#07ad59" stroke="#136f42" stroke-width="2"/>
  </g>

  <g id="fc2">
    <rect x="1315" y="120" width="135" height="665" rx="22" class="frame-blue"/>
    <text x="1382" y="158" class="label section-title" text-anchor="middle">全結合層</text>
    <circle cx="1382" cy="240" r="38" fill="#07ad59" stroke="#136f42" stroke-width="2"/>
    <circle cx="1382" cy="385" r="38" fill="#07ad59" stroke="#136f42" stroke-width="2"/>
    <text x="1382" y="520" class="label medium" text-anchor="middle">︙</text>
    <circle cx="1382" cy="640" r="38" fill="#07ad59" stroke="#136f42" stroke-width="2"/>
  </g>

  <g id="activation-output">
    <text x="1512" y="154" class="label section-title" text-anchor="middle">活性化関数</text>
    <rect x="1476" y="195" width="72" height="510" fill="url(#activationGrad)" stroke="#64748b" stroke-width="2"/>
    <text x="1651" y="154" class="label section-title" text-anchor="middle">出力層</text>
    <rect x="1625" y="195" width="52" height="510" fill="url(#outputGrad)" stroke="#b77900" stroke-width="2"/>
  </g>

  <g id="connections" stroke-linecap="round">
    <path d="M 402 262 L 548 233" class="thin-line" marker-end="url(#arrow)"/>
    <path d="M 402 447 L 548 423" class="thin-line" marker-end="url(#arrow)"/>
    <path d="M 402 682 L 548 672" class="thin-line" marker-end="url(#arrow)"/>

    <path d="M 618 233 L 747 233" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 618 233 L 747 428" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 618 423 L 747 233" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 618 423 L 747 428" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 618 423 L 747 680" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 618 672 L 747 428" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 618 672 L 747 680" class="fan-line" marker-end="url(#arrow)"/>

    <path d="M 857 245 L 970 232" class="thin-line" marker-end="url(#arrow)"/>
    <path d="M 857 435 L 970 422" class="thin-line" marker-end="url(#arrow)"/>
    <path d="M 857 687 L 970 680" class="thin-line" marker-end="url(#arrow)"/>

    <path d="M 1025 232 L 1163 210" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1025 232 L 1163 335" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1025 422 L 1163 210" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1025 422 L 1163 335" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1025 422 L 1163 685" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1025 680 L 1163 335" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1025 680 L 1163 685" class="fan-line" marker-end="url(#arrow)"/>

    <path d="M 1240 210 L 1343 240" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1240 210 L 1343 385" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1240 335 L 1343 240" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1240 335 L 1343 385" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1240 335 L 1343 640" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1240 685 L 1343 385" class="fan-line" marker-end="url(#arrow)"/>
    <path d="M 1240 685 L 1343 640" class="fan-line" marker-end="url(#arrow)"/>

    <path d="M 1420 240 L 1476 240" class="thin-line" marker-end="url(#arrow)"/>
    <path d="M 1420 385 L 1476 385" class="thin-line" marker-end="url(#arrow)"/>
    <path d="M 1420 640 L 1476 640" class="thin-line" marker-end="url(#arrow)"/>
    <path d="M 1548 240 L 1625 240" class="thin-line" marker-end="url(#arrow)"/>
    <path d="M 1548 385 L 1625 385" class="thin-line" marker-end="url(#arrow)"/>
    <path d="M 1548 640 L 1625 640" class="thin-line" marker-end="url(#arrow)"/>
  </g>
</svg>
