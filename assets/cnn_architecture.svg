<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">CNN architecture diagram</title>
  <desc id="desc">A simple convolutional neural network for CIFAR-100 image classification.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#94a3b8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1120" height="360" fill="#f8fafc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">CIFAR-100 用の小さな CNN</text>
  <text x="40" y="72" font-family="Arial, sans-serif" font-size="15" fill="#475569">画像の空間構造を保ったまま特徴を取り出し，最後に100クラスの logits へ変換する。</text>

  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="38" y="126" width="132" height="96" rx="8" fill="#dbeafe" stroke="#2563eb"/>
      <text x="104" y="158" font-weight="700" fill="#1e3a8a">入力画像</text>
      <text x="104" y="184" fill="#1e40af">3 × 32 × 32</text>
      <text x="104" y="205" fill="#1e40af">RGB</text>
    </g>
    <line x1="182" y1="174" x2="236" y2="174" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="250" y="110" width="150" height="128" rx="8" fill="#dcfce7" stroke="#16a34a"/>
      <text x="325" y="142" font-weight="700" fill="#14532d">Conv Block 1</text>
      <text x="325" y="168" fill="#166534">Conv 3×3</text>
      <text x="325" y="190" fill="#166534">BatchNorm + ReLU</text>
      <text x="325" y="212" fill="#166534">MaxPool</text>
      <text x="325" y="232" fill="#166534">32 × 16 × 16</text>
    </g>
    <line x1="412" y1="174" x2="466" y2="174" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="480" y="110" width="150" height="128" rx="8" fill="#dcfce7" stroke="#16a34a"/>
      <text x="555" y="142" font-weight="700" fill="#14532d">Conv Block 2</text>
      <text x="555" y="168" fill="#166534">Conv 3×3</text>
      <text x="555" y="190" fill="#166534">BatchNorm + ReLU</text>
      <text x="555" y="212" fill="#166534">MaxPool</text>
      <text x="555" y="232" fill="#166534">64 × 8 × 8</text>
    </g>
    <line x1="642" y1="174" x2="696" y2="174" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="710" y="110" width="150" height="128" rx="8" fill="#fef3c7" stroke="#d97706"/>
      <text x="785" y="142" font-weight="700" fill="#78350f">Conv Block 3</text>
      <text x="785" y="168" fill="#92400e">Conv 3×3</text>
      <text x="785" y="190" fill="#92400e">BatchNorm + ReLU</text>
      <text x="785" y="212" fill="#92400e">128 × 8 × 8</text>
      <text x="785" y="232" fill="#92400e">Global Avg → 128</text>
    </g>
    <line x1="872" y1="174" x2="926" y2="174" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="940" y="126" width="140" height="96" rx="8" fill="#fae8ff" stroke="#9333ea"/>
      <text x="1010" y="158" font-weight="700" fill="#581c87">分類器</text>
      <text x="1010" y="184" fill="#6b21a8">Linear</text>
      <text x="1010" y="205" fill="#6b21a8">100 logits</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#475569">
    <text x="250" y="275">畳み込み: 近くの画素パターンを検出</text>
    <text x="250" y="300">プーリング: 位置のずれに少し強くしながらサイズを縮小</text>
    <text x="710" y="275">Global Average Pooling: 特徴マップをクラス分類用のベクトルへ圧縮</text>
  </g>
</svg>
