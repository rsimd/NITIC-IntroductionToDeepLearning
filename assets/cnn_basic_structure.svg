<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="500" viewBox="0 0 1220 500" role="img" aria-labelledby="title desc">
  <title id="title">CNN の基本構造</title>
  <desc id="desc">入力画像を畳み込み層と活性化関数，プーリング層で処理し，最後に Flatten または Global Average Pooling と Dense 層でクラスに分類する流れ。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .label { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .block-title { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .block-text { font-size: 15px; fill: #334155; text-anchor: middle; }
      .note { font-size: 17px; fill: #475569; }
    </style>
  </defs>

  <rect width="1220" height="500" fill="#ffffff"/>
  <text x="610" y="48" class="label title" text-anchor="middle">CNN の基本構造</text>
  <text x="610" y="82" class="label subtitle" text-anchor="middle">畳み込みで特徴を取り出し，必要に応じて小さくし，最後に分類器へ渡す。</text>

  <g transform="translate(45 150)">
    <rect x="0" y="50" width="125" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="62.5" y="88" class="label block-title">入力画像</text>
    <text x="62.5" y="121" class="label block-text">H x W x C</text>
    <text x="62.5" y="146" class="label block-text">例: 28 x 28 x 1</text>

    <line x1="138" y1="105" x2="188" y2="105" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="200" y="20" width="155" height="170" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="277.5" y="58" class="label block-title">Conv + ReLU</text>
    <text x="277.5" y="91" class="label block-text">小さな窓で</text>
    <text x="277.5" y="116" class="label block-text">線・角・模様を</text>
    <text x="277.5" y="141" class="label block-text">特徴マップにする</text>

    <line x1="368" y1="105" x2="418" y2="105" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="430" y="40" width="130" height="130" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="495" y="79" class="label block-title">Pooling</text>
    <text x="495" y="112" class="label block-text">近い情報を</text>
    <text x="495" y="137" class="label block-text">まとめる</text>

    <line x1="573" y1="105" x2="623" y2="105" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="635" y="20" width="155" height="170" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="712.5" y="58" class="label block-title">Conv + ReLU</text>
    <text x="712.5" y="91" class="label block-text">組み合わせて</text>
    <text x="712.5" y="116" class="label block-text">より大きな特徴を</text>
    <text x="712.5" y="141" class="label block-text">見つける</text>

    <line x1="803" y1="105" x2="853" y2="105" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="865" y="40" width="140" height="130" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="935" y="78" class="label block-title">Flatten</text>
    <text x="935" y="106" class="label block-text">または</text>
    <text x="935" y="133" class="label block-text">Global Avg Pool</text>

    <line x1="1018" y1="105" x2="1068" y2="105" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="1080" y="50" width="125" height="110" rx="12" fill="#fae8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="1142.5" y="88" class="label block-title">Dense</text>
    <text x="1142.5" y="121" class="label block-text">クラスごとの</text>
    <text x="1142.5" y="146" class="label block-text">スコア</text>
  </g>

  <g transform="translate(105 385)">
    <rect width="1010" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="26" y="28" class="label note">よくある並びは「Conv -> ReLU -> Pool」を数回くり返してから分類器へ渡す形である。</text>
    <text x="26" y="55" class="label note">最近のモデルでは Flatten の代わりに Global Average Pooling を使うことも多い。</text>
  </g>
</svg>
