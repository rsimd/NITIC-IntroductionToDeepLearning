<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CNN Convolution Animation</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --paper: #ffffff;
      --ink: #202124;
      --muted: #5f6368;
      --line: #d7dde5;
      --blue: #1a73e8;
      --green: #188038;
      --red: #d93025;
      --soft-blue: #e8f0fe;
      --soft-green: #e6f4ea;
      --soft-red: #fce8e6;
      --shadow: 0 14px 32px rgba(60, 64, 67, .13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    h1 { margin: 0; font-size: 21px; letter-spacing: 0; }
    .meta { color: var(--muted); font-size: 13px; }
    .controls {
      display: grid;
      grid-template-columns: auto auto auto minmax(120px, 220px);
      gap: 8px;
      align-items: center;
    }
    button {
      min-height: 34px;
      border: 1px solid #b8c8e8;
      border-radius: 6px;
      padding: 6px 12px;
      color: #174ea6;
      background: var(--soft-blue);
      font-weight: 650;
      cursor: pointer;
    }
    input[type="range"] { width: 100%; }
    main {
      display: grid;
      gap: 14px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .stat,
    section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 1px 2px rgba(60, 64, 67, .05);
    }
    .stat { padding: 9px 10px; }
    .stat b { display: block; font-size: 20px; line-height: 1.1; }
    .stat span { color: var(--muted); font-size: 12px; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
    }
    h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
    .small { color: var(--muted); font-size: 12px; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(170px, .55fr) minmax(0, 1fr) 160px minmax(0, .72fr);
      gap: 16px;
      align-items: center;
      padding: 18px;
    }
    .matrix-panel {
      display: grid;
      gap: 10px;
      justify-items: center;
    }
    .grid {
      display: grid;
      gap: 5px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcff;
    }
    .input-grid { grid-template-columns: repeat(5, 52px); }
    .kernel-grid { grid-template-columns: repeat(3, 44px); }
    .output-grid { grid-template-columns: repeat(3, 60px); }
    .cell {
      display: grid;
      place-items: center;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      transition: background .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }
    .kernel-grid .cell { height: 42px; background: #fff8dc; }
    .kernel-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    .kernel-option {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      background: white;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }
    .kernel-option.active {
      border-color: #7baaf7;
      background: var(--soft-blue);
      color: #174ea6;
    }
    .kernel-note {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .cell.window {
      border-color: #7baaf7;
      background: var(--soft-blue);
      box-shadow: 0 0 0 2px rgba(26, 115, 232, .16) inset;
    }
    .cell.active-out {
      border-color: var(--green);
      background: var(--soft-green);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .operator {
      display: grid;
      gap: 12px;
      justify-items: center;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }
    .operator b {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      font-size: 30px;
      box-shadow: var(--shadow);
    }
    .formula {
      margin: 0 18px 18px;
      border: 1px solid #7baaf7;
      border-radius: 8px;
      padding: 12px;
      background: #f3f8ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      overflow-x: auto;
    }
    @media (max-width: 900px) {
      header { align-items: flex-start; flex-direction: column; }
      .controls { grid-template-columns: auto auto auto 1fr; width: 100%; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workspace { grid-template-columns: 1fr; }
      .input-grid { grid-template-columns: repeat(5, minmax(38px, 1fr)); width: 100%; }
      .output-grid { grid-template-columns: repeat(3, minmax(48px, 1fr)); width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>CNN: Convolution</h1>
      <div class="meta">3×3 kernel が入力画像上を滑り，局所領域との積和から feature map を作る</div>
    </div>
    <div class="controls">
      <button id="play">一時停止</button>
      <button id="prev">戻る</button>
      <button id="next">進む</button>
      <input id="seek" type="range" min="0" max="8" value="0" step="1" aria-label="position">
    </div>
  </header>

  <main>
    <div class="stats">
      <div class="stat"><b id="position">row 0, col 0</b><span>kernel の位置</span></div>
      <div class="stat"><b>5×5</b><span>input image</span></div>
      <div class="stat"><b>3×3</b><span>kernel</span></div>
      <div class="stat"><b>3×3</b><span>output feature map</span></div>
    </div>

    <section>
      <div class="panel-head">
        <h2>畳み込みの計算</h2>
        <span class="small">stride = 1, padding = 0</span>
      </div>
      <div class="workspace">
        <div class="matrix-panel">
          <h2>kernel W</h2>
          <div class="kernel-options" id="kernelOptions"></div>
          <div class="kernel-note" id="kernelNote"></div>
          <div class="grid kernel-grid" id="kernelGrid"></div>
        </div>
        <div class="matrix-panel">
          <h2>input image X</h2>
          <div class="grid input-grid" id="inputGrid"></div>
        </div>
        <div class="operator">
          <b>⊙Σ</b>
          <span>3×3領域とkernelを要素ごとに掛け，合計する</span>
        </div>
        <div class="matrix-panel">
          <h2>feature map Y</h2>
          <div class="grid output-grid" id="outputGrid"></div>
        </div>
      </div>
      <div class="formula" id="formula"></div>
    </section>
  </main>

  <script>
const input = [
  [0, 0, 1, 2, 2],
  [0, 1, 2, 3, 3],
  [1, 2, 4, 4, 3],
  [1, 1, 3, 5, 4],
  [0, 1, 2, 3, 4],
];
const kernels = [
  {
    name: "vertical edge",
    note: "縦方向のエッジ",
    values: [
      [-1, 0, 1],
      [-1, 0, 1],
      [-1, 0, 1],
    ],
  },
  {
    name: "horizontal edge",
    note: "横方向のエッジ",
    values: [
      [-1, -1, -1],
      [0, 0, 0],
      [1, 1, 1],
    ],
  },
  {
    name: "sharpen",
    note: "中心を強調",
    values: [
      [0, -1, 0],
      [-1, 5, -1],
      [0, -1, 0],
    ],
  },
];
let kernelIndex = 0;
const positions = Array.from({ length: 9 }, (_, i) => [Math.floor(i / 3), i % 3]);
let index = 0;
let playing = true;
let timer = null;

function currentKernel() {
  return kernels[kernelIndex].values;
}

function convAt(r, c) {
  const kernel = currentKernel();
  let sum = 0;
  const terms = [];
  for (let kr = 0; kr < 3; kr++) {
    for (let kc = 0; kc < 3; kc++) {
      const x = input[r + kr][c + kc];
      const w = kernel[kr][kc];
      sum += x * w;
      terms.push(`${x}×${w}`);
    }
  }
  return { sum, terms };
}

function makeCell(value, className = "") {
  const node = document.createElement("div");
  node.className = `cell ${className}`.trim();
  node.textContent = value;
  return node;
}

function renderKernelOptions() {
  const root = document.getElementById("kernelOptions");
  if (root.children.length === 0) {
    kernels.forEach((kernel, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "kernel-option";
      button.textContent = kernel.name;
      button.addEventListener("click", () => {
        kernelIndex = i;
        render();
        schedule();
      });
      root.appendChild(button);
    });
  }
  [...root.children].forEach((button, i) => {
    button.classList.toggle("active", i === kernelIndex);
  });
}

function outputValues() {
  return positions.map(([rr, cc]) => convAt(rr, cc).sum);
}

function render() {
  const [r, c] = positions[index];
  const kernel = currentKernel();
  const output = outputValues();
  const active = new Set();
  for (let rr = r; rr < r + 3; rr++) {
    for (let cc = c; cc < c + 3; cc++) active.add(`${rr}-${cc}`);
  }

  const inputRoot = document.getElementById("inputGrid");
  inputRoot.innerHTML = "";
  input.forEach((row, rr) => {
    row.forEach((value, cc) => inputRoot.appendChild(makeCell(value, active.has(`${rr}-${cc}`) ? "window" : "")));
  });

  const kernelRoot = document.getElementById("kernelGrid");
  kernelRoot.innerHTML = "";
  kernel.flat().forEach(value => kernelRoot.appendChild(makeCell(value)));
  renderKernelOptions();
  document.getElementById("kernelNote").textContent = kernels[kernelIndex].note;

  const outputRoot = document.getElementById("outputGrid");
  outputRoot.innerHTML = "";
  output.forEach((value, i) => outputRoot.appendChild(makeCell(value, i === index ? "active-out" : "")));

  const calc = convAt(r, c);
  document.getElementById("position").textContent = `row ${r}, col ${c}`;
  document.getElementById("seek").value = String(index);
  document.getElementById("formula").textContent =
    `kernel: ${kernels[kernelIndex].note} / Y[${r}, ${c}] = Σ X[${r}:${r + 3}, ${c}:${c + 3}] ⊙ W = ${calc.terms.join(" + ")} = ${calc.sum}`;
}

function goNext() {
  index = (index + 1) % positions.length;
  render();
}

function goPrev() {
  index = (index - 1 + positions.length) % positions.length;
  render();
}

function schedule() {
  clearInterval(timer);
  if (playing) timer = setInterval(goNext, 1200);
}

document.getElementById("play").addEventListener("click", () => {
  playing = !playing;
  document.getElementById("play").textContent = playing ? "一時停止" : "再生";
  schedule();
});
document.getElementById("prev").addEventListener("click", () => { goPrev(); schedule(); });
document.getElementById("next").addEventListener("click", () => { goNext(); schedule(); });
document.getElementById("seek").addEventListener("input", event => {
  index = Number(event.target.value);
  render();
  schedule();
});

render();
schedule();
  </script>
</body>
</html>
